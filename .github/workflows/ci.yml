name: CI

on:
  push:
  pull_request:

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  app:
    name: App (types, unit tests, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run audit:prod
      - run: VITE_API_URL=https://api.example.com npm run build:prod

  server:
    name: API (types, audit, API + security tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
      - name: Local test secrets (not real keys)
        run: |
          printf 'JWT_SECRET=dev-only-secret-change-me-0123456789abcdef\nADMIN_KEY=dev-admin-key\nDEV_RETURN_OTP=1\nSECRETS_KEY=dev-only-secrets-key-change-me-0123456789\nPUBLIC_URL=http://127.0.0.1:8787\nENABLE_MOCK_PAY=1\nMAIL_DAILY_LIMIT=5\n' > .dev.vars
      - run: npx wrangler d1 migrations apply pasal --local
      - name: Start the API and run the tests
        run: |
          npm run dev:test > api.log 2>&1 &
          for i in $(seq 1 40); do curl -s localhost:8787/health >/dev/null && break; sleep 2; done
          npm test
      - if: failure()
        run: tail -50 api.log || true

  e2e:
    name: Browser tests (new shop, two phones, front-end security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: server
      - name: Local test secrets (not real keys)
        working-directory: server
        run: |
          printf 'JWT_SECRET=dev-only-secret-change-me-0123456789abcdef\nADMIN_KEY=dev-admin-key\nDEV_RETURN_OTP=1\nSECRETS_KEY=dev-only-secrets-key-change-me-0123456789\nPUBLIC_URL=http://127.0.0.1:8787\nENABLE_MOCK_PAY=1\nMAIL_DAILY_LIMIT=5\n' > .dev.vars
      - run: npx wrangler d1 migrations apply pasal --local
        working-directory: server
      - name: Start the API and the web app
        run: |
          (cd server && npm run dev:test > ../api.log 2>&1 &)
          (cd app && VITE_API_URL=http://127.0.0.1:8787 npm run dev -- --port 5173 > ../app.log 2>&1 &)
          for i in $(seq 1 40); do curl -s localhost:8787/health >/dev/null && curl -s localhost:5173 >/dev/null && break; sleep 2; done
      - name: New shop, two phones, offline, cloud
        working-directory: app
        run: CHROME=/usr/bin/google-chrome node e2e/shop2.mjs
      - name: Phones and tablets (iPhone, Android, iPad sizes)
        working-directory: app
        run: CHROME=/usr/bin/google-chrome node e2e/mobile.mjs
      - name: Admin page
        working-directory: app
        run: CHROME=/usr/bin/google-chrome node e2e/admin.mjs
      - name: Front-end security (strict policy, framing, injection)
        working-directory: app
        run: |
          VITE_API_URL=http://127.0.0.1:8787 npm run build:prod
          CHROME=/usr/bin/google-chrome VITE_API_URL=http://127.0.0.1:8787 node e2e/security.mjs
      - if: failure()
        run: tail -40 api.log app.log || true
