name = "pocket-pasal-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "pasal"
database_id = "4c1158e1-76a5-48ef-9145-e548953653dd"
migrations_dir = "migrations"

[vars]
# Comma separated list of web app origins allowed to call this API.
ALLOWED_ORIGINS = "https://pocket-pasal.dahal-khani.workers.dev"
MAIL_FROM = "Pocket Pasal <onboarding@resend.dev>"
# Local testing only: return the OTP in the response instead of relying on email.
# Never set this to 1 in production.
DEV_RETURN_OTP = "0"
ENABLE_MOCK_PAY = "0"
MAIL_DAILY_LIMIT = "100"
# Where new closure requests are announced (leave empty to skip)
ADMIN_EMAIL = ""
# The public address of this API once deployed, for example https://pasal-api.yourname.workers.dev
PUBLIC_URL = "https://pocket-pasal-api.dahal-khani.workers.dev"

# Secrets (set with `npx wrangler secret put NAME`, or in .dev.vars for local runs):
#   JWT_SECRET      long random string
#   ADMIN_KEY       key for /admin/* routes (you, the seller)
#   RESEND_API_KEY  API key from resend.com to send OTP emails
#   SECRETS_KEY     long random string that encrypts shops' Khalti / eSewa keys
#   GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN, GMAIL_SENDER   send email from a Gmail account (no domain needed, see README)

[triggers]
# Daily at 03:17 UTC: erase accounts whose approved closure request has reached its date.
crons = ["17 3 * * *"]
